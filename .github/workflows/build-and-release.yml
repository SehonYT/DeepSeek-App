name: Build and Release DeepSeek APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
      - dev
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      draft:
        description: 'Create Draft Release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build DeepSeek APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Java JDK (Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android Build Tools & System Utilities
        run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y --fix-missing aapt zipalign apksigner file zip unzip gzip && break || sleep 5
          done

      - name: Prepare Android Build Tools & Keystore
        run: |
          mkdir -p tools vendor archives
          
          # 1. Generate debug keystore if absent
          if [ ! -f "tools/debug.keystore" ]; then
            echo "[CI] Generating debug keystore..."
            keytool -genkey -v -keystore tools/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Setup Android API 34 android.jar if absent
          if [ ! -f "tools/android.jar" ]; then
            echo "[CI] Fetching android.jar (API 34)..."
            curl -fsSL -o tools/android.jar "https://raw.githubusercontent.com/Sable/android-platforms/master/android-34/android.jar"
          fi

          # 3. Setup R8 / D8 compiler jar if absent
          if [ ! -f "tools/r8.jar" ]; then
            echo "[CI] Fetching r8.jar..."
            curl -fsSL -o tools/r8.jar "https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.2.42/r8-8.2.42.jar"
          fi

      - name: Assemble DeepSeek Harness Runtime Bundle
        run: |
          mkdir -p archives
          echo "[CI] 1. Cloning deepseek-harness..."
          git clone --depth 1 https://github.com/salmanbappi/deepseek-harness.git archives/dsh-source

          echo "[CI] 2. Unpacking compiled lib prebuilt..."
          curl -fsSL "https://github.com/salmanbappi/deepseek-harness/releases/download/v0.2.2-rc.3/dsh-termux-prebuilt-v0.2.2-rc.3.tar.gz" | tar -xz -C archives/dsh-source

          echo "[CI] 3. Installing pnpm..."
          npm install -g pnpm@11.28.5 || sudo npm install -g pnpm@11.28.5

          echo "[CI] 4. Installing production dependencies..."
          cd archives/dsh-source
          pnpm install --prod --frozen-lockfile=false --ignore-scripts

          echo "[CI] 5. Applying mobile patches..."
          python3 scripts/patch_termux.py --apply || true

          echo "[CI] 6. Installing sharp wasm32..."
          mkdir -p node_modules/@img node_modules/@emnapi
          curl -sL https://registry.npmjs.org/@img/sharp-wasm32/-/sharp-wasm32-0.35.5.tgz | tar -xz -C node_modules/@img
          rm -rf node_modules/@img/sharp-wasm32 && mv node_modules/@img/package node_modules/@img/sharp-wasm32
          curl -sL https://registry.npmjs.org/@emnapi/runtime/-/runtime-1.11.3.tgz | tar -xz -C node_modules/@emnapi
          rm -rf node_modules/@emnapi/runtime && mv node_modules/@emnapi/package node_modules/@emnapi/runtime

          echo "[CI] 7. Installing android-arm64 pty.node..."
          find node_modules -type d -name node-pty -not -path '*/node-pty/*' -exec mkdir -p {}/prebuilds/android-arm64 \; -exec cp "$GITHUB_WORKSPACE/vendor/native/android-arm64/pty.node" {}/prebuilds/android-arm64/pty.node \;

          echo "[CI] 8. Pruning LibreOffice WASM and test/dev bloat..."
          find node_modules -maxdepth 6 \( -type d -o -type l \) -name 'libreoffice-kit-*' -prune -exec rm -rf {} + || true
          rm -rf .git tests benchmarks docs

          echo "[CI] 9. Repacking runtime archive..."
          cd ../..
          tar -czf archives/dsh-termux-prebuilt-v0.2.2-rc.3.tar.gz -C archives/dsh-source .
          ls -lh archives/

      - name: Sync App Version from Tag
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          if [[ "$TAG" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VER="${BASH_REMATCH[1]}"
            echo "[CI] Updating config/app.env to version $VER (from $TAG)..."
            sed -i -E "s/^APP_VERSION_NAME=.*/APP_VERSION_NAME=$VER/" config/app.env
            IFS='.' read -r major minor patch <<< "$VER"
            CODE=$(( major * 10000 + minor * 100 + patch ))
            sed -i -E "s/^APP_VERSION_CODE=.*/APP_VERSION_CODE=$CODE/" config/app.env
          fi
          cat config/app.env

      - name: Build DeepSeek Release APK (dist/deepseek.apk)
        run: |
          bash build.sh

      - name: Build DeepSeek Dev APK (dist/deepseek-dev.apk)
        run: |
          bash build.sh --dev

      - name: Compute Cryptographic Checksums
        run: |
          cd dist
          sha256sum deepseek.apk deepseek-dev.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-binaries
          path: |
            dist/deepseek.apk
            dist/deepseek-dev.apk
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ format('DeepSeek Mobile {0}', github.event.inputs.tag_name || github.ref_name) }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          make_latest: true
          files: |
            dist/deepseek.apk
            dist/deepseek-dev.apk
            dist/SHA256SUMS.txt
          body: |
            ### DeepSeek Mobile for Android
            Autonomous AI Coding Environment &bull; Native Termux Bionic Userspace &bull; ARM64
