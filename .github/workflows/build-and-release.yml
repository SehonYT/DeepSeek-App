name: Build and Release DeepSeek APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
      - dev
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      draft:
        description: 'Create Draft Release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false
      vendor_url:
        description: 'Optional direct URL to download vendor inputs archive'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build DeepSeek APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Java JDK (Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android Build Tools & System Utilities
        run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y --fix-missing aapt zipalign apksigner file zip unzip gzip && break || sleep 5
          done

      - name: Prepare Android Build Tools & Keystore
        run: |
          mkdir -p tools vendor archives
          
          # 1. Generate debug keystore if absent
          if [ ! -f "tools/debug.keystore" ]; then
            echo "[CI] Generating debug keystore..."
            keytool -genkey -v -keystore tools/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Setup Android API 28 android.jar if absent
          if [ ! -f "tools/android.jar" ]; then
            echo "[CI] Fetching android.jar (API 28)..."
            curl -fsSL -o tools/android.jar "https://github.com/Sable/android-platforms/raw/master/android-28/android.jar" || \
            curl -fsSL -o tools/android.jar "https://raw.githubusercontent.com/iBotPeaches/platform_frameworks_base/master/android-28.jar"
          fi

          # 3. Setup R8 / D8 compiler jar if absent
          if [ ! -f "tools/r8.jar" ]; then
            echo "[CI] Fetching r8.jar..."
            curl -fsSL -o tools/r8.jar "https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.2.42/r8-8.2.42.jar"
          fi

      - name: Fetch DeepSeek Harness Runtime Bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[CI] Fetching latest prebuilt DeepSeek Harness Termux release..."
          LATEST_TARBALL=$(curl -fsSL "https://api.github.com/repos/salmanbappi/deepseek-harness/releases/latest" | grep "browser_download_url.*dsh-termux-prebuilt.*\.tar\.gz" | cut -d '"' -f 4 | head -n 1 || true)
          if [ -n "$LATEST_TARBALL" ]; then
            echo "[CI] Downloading $LATEST_TARBALL..."
            curl -fsSL -o archives/dsh-termux-prebuilt.tar.gz "$LATEST_TARBALL"
          else
            echo "[CI] Trying direct download..."
            curl -fsSL -o archives/dsh-termux-prebuilt.tar.gz "https://github.com/salmanbappi/deepseek-harness/releases/download/v0.2.2-rc.3/dsh-termux-prebuilt-v0.2.2-rc.3.tar.gz" || true
          fi
          ls -lh archives/

      - name: Build DeepSeek Release APK (dist/deepseek.apk)
        run: |
          bash build.sh

      - name: Build DeepSeek Dev APK (dist/deepseek-dev.apk)
        run: |
          bash build.sh --dev

      - name: Compute Cryptographic Checksums
        run: |
          cd dist
          sha256sum deepseek.apk deepseek-dev.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-binaries
          path: |
            dist/deepseek.apk
            dist/deepseek-dev.apk
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ format('DeepSeek Mobile {0}', github.event.inputs.tag_name || github.ref_name) }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          make_latest: true
          files: |
            dist/deepseek.apk
            dist/deepseek-dev.apk
            dist/SHA256SUMS.txt
          body: |
            <div align="center">
              <h3>DeepSeek Mobile for Android</h3>
              <p>Autonomous AI Coding Environment &bull; Native Termux Bionic Userspace &bull; ARM64</p>
            </div>

            ---

            ### Packages & Artifacts

            | Package | Description |
            | :--- | :--- |
            | **`deepseek.apk`** | Standard production release with native bionic engine (com.dsh, port 45257) |
            | **`deepseek-dev.apk`** | Developer edition with debug flags (com.dsh.dev, port 45258) |
            | **`SHA256SUMS.txt`** | Cryptographic checksums for package integrity verification |

            ---

            ### Features

            * **Native Termux Bionic Userspace:** Runs directly in native Android userspace without virtualization or PRoot overhead.
            * **DeepSeek AI Agent Engine:** Powered by DeepSeek Harness with full terminal, tools, subagents, and memory capabilities.
            * **Full Web & Mobile UI:** Material 3 UI loaded smoothly via internal WebView with background micro-service supervisor.
