name: Build and Release DeepSeek APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      draft:
        description: 'Create Draft Release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ${{ matrix.apk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: universal
            arch: universal
            dev: 'false'
            apk: deepseek.apk
          - target: arm64-v8a
            arch: arm64-v8a
            dev: 'false'
            apk: deepseek-arm64-v8a.apk
          - target: armeabi-v7a
            arch: armeabi-v7a
            dev: 'false'
            apk: deepseek-armeabi-v7a.apk
          - target: dev
            arch: universal
            dev: 'true'
            apk: deepseek-dev.apk

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Java JDK (Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android Build Tools & System Utilities
        run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y --fix-missing aapt zipalign apksigner file zip unzip gzip zstd && break || sleep 5
          done
          npm install -g esbuild

      - name: Prepare Android Build Tools & Keystore
        run: |
          mkdir -p tools vendor archives

          if [ -f "tools/release.keystore" ]; then
            echo "[CI] Using committed release.keystore (signed with salman2005)..."
            cp -f tools/release.keystore tools/debug.keystore
          else
            echo "[CI] Creating release keystore..."
            keytool -genkeypair -v -keystore tools/release.keystore \
              -storepass salman2005 -keypass salman2005 \
              -alias salman2005 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=DeepSeek, OU=Mobile, O=salmanbappi, C=US"
            cp -f tools/release.keystore tools/debug.keystore
          fi

          if [ ! -f "tools/android.jar" ]; then
            echo "[CI] Fetching android.jar (API 34)..."
            curl -fsSL -o tools/android.jar "https://raw.githubusercontent.com/Sable/android-platforms/master/android-34/android.jar"
          fi

          if [ ! -f "tools/r8.jar" ]; then
            echo "[CI] Fetching r8.jar..."
            curl -fsSL -o tools/r8.jar "https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.2.42/r8-8.2.42.jar"
          fi

      - name: Cross-Compile Native Binaries (${{ matrix.arch }})
        run: |
          mkdir -p archives
          echo "[CI] Cloning deepseek-harness source..."
          git clone --depth 1 https://github.com/salmanbappi/deepseek-harness.git archives/dsh-source

          if [ "${{ matrix.arch }}" != "arm64-v8a" ] && [ ! -f "vendor/native/android-arm/pty.node" ]; then
            echo "[CI] Building 32-bit armeabi-v7a pty.node with Android NDK..."
            bash scripts/build_pty_node.sh --arch android-arm --dsh-source archives/dsh-source
          fi
          echo "[CI] Building native zstd decompression binary (${{ matrix.arch }})..."
          bash scripts/build_zstd.sh --arch "${{ matrix.arch }}"
          ls -lh app/src/main/jniLibs/*/libdsh_zstd.so

      - name: Assemble Runtime Bundle (${{ matrix.arch }}, .tar.zst)
        run: |
          python3 scripts/assemble_runtime.py --arch "${{ matrix.arch }}" archives/dsh-source "archives/dsh-termux-prebuilt-v0.2.2-rc.3-${{ matrix.arch }}.tar.zst"
          ls -lh "archives/dsh-termux-prebuilt-v0.2.2-rc.3-${{ matrix.arch }}.tar.zst"

      - name: Build Pre-Patched zstd Termux Bootstrap (${{ matrix.arch }})
        run: |
          bash env/build.sh --arch "${{ matrix.arch }}" bootstrap
          ls -lh env/bootstrap/bootstrap*.tar.zst

      - name: Sync App Version from Tag
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          if [[ "$TAG" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VER="${BASH_REMATCH[1]}"
            echo "[CI] Updating config/app.env to version $VER (from $TAG)..."
            sed -i -E "s/^APP_VERSION_NAME=.*/APP_VERSION_NAME=$VER/" config/app.env
            IFS='.' read -r major minor patch <<< "$VER"
            CODE=$(( major * 10000 + minor * 100 + patch ))
            sed -i -E "s/^APP_VERSION_CODE=.*/APP_VERSION_CODE=$CODE/" config/app.env
          fi
          cat config/app.env

      - name: Build ${{ matrix.apk }}
        run: |
          if [ "${{ matrix.dev }}" = "true" ]; then
            bash build.sh --dev --arch "${{ matrix.arch }}"
          else
            bash build.sh --arch "${{ matrix.arch }}"
          fi

      - name: Verify APK ABI & Manifest Integrity
        run: |
          python3 scripts/verify_apk_abi.py "dist/${{ matrix.apk }}" --arch "${{ matrix.arch }}"

      - name: Upload ${{ matrix.apk }} Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.target }}
          path: dist/${{ matrix.apk }}

  release:
    name: Package & Publish Release
    needs: build-apk
    runs-on: ubuntu-latest

    steps:
      - name: Download Built APKs
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: true
          path: dist

      - name: Compute Cryptographic Checksums
        run: |
          cd dist
          sha256sum deepseek.apk deepseek-arm64-v8a.apk deepseek-armeabi-v7a.apk deepseek-dev.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Combined Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-binaries
          path: |
            dist/deepseek.apk
            dist/deepseek-arm64-v8a.apk
            dist/deepseek-armeabi-v7a.apk
            dist/deepseek-dev.apk
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ format('DeepSeek Mobile {0}', github.event.inputs.tag_name || github.ref_name) }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          make_latest: true
          files: |
            dist/deepseek.apk
            dist/deepseek-arm64-v8a.apk
            dist/deepseek-armeabi-v7a.apk
            dist/deepseek-dev.apk
            dist/SHA256SUMS.txt
          body: |
            ### DeepSeek Mobile for Android
            Autonomous AI Coding Environment &bull; Native Termux Bionic Userspace &bull; Universal (`arm64-v8a` + `armeabi-v7a`) &amp; ABI Splits
